version: 1.3.1

endpoints:
  custom:
    - name: DeepSeek
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com'
      models:
        default:
          - deepseek-v4-pro
          - deepseek-v4-flash
        fetch: false
      titleConvo: true
      titleModel: deepseek-v4-flash
      modelDisplayLabel: DeepSeek
      customParams:
        reasoningFormat: reasoning_effort
        reasoningKey: reasoning_content
        includeReasoningContent: true
        includeReasoningHistory: true
      dropParams:
        - frequency_penalty
        - presence_penalty

mcpServers:
  comsol:
    title: COMSOL Multiphysics MCP
    description: Unofficial local COMSOL automation tools
    type: stdio
    command: 'T:\comsol_mcp\vendor\COMSOL_Multiphysics_MCP\.venv\Scripts\python.exe'
    args:
      - -m
      - src.server
    initTimeout: 60000
    timeout: 600000
    stderr: inherit
    chatMenu: true
    startup: true
    serverInstructions: |
      This is an unofficial COMSOL automation server. Before creating, changing,
      solving, or saving a model, summarize the intended physical assumptions and
      target absolute path. Never overwrite an existing MPH file. Use one COMSOL
      session at a time and ask for confirmation before expensive solves.
